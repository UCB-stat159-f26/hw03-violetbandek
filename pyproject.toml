[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-career-violetbandek"
version = "0.1.0"
description = "Tennis career match data and visualization"
requires-python = ">=3.9"
dependencies = ["pandas", "matplotlib", "requests"]

[tool.setuptools.packages.find]
where = ["src"]